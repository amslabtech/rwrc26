# =============================================================================
# road_edge_detector  C2 広角カメラ（2880x1860, 約120度, 取付角 0 度）用パラメータ
#   ROI は画像サイズに依存しない正規化座標（0〜1）で指定する。
#   2880x1860 でのピクセル座標は README の「ROI」の節を参照。
# =============================================================================

# ---- 連続検出 ---------------------------------------------------------------
detection_count_th: 3        # 何フレーム連続で検知したら「検知確定」とするか（launch の num_detection で上書き）
max_jump: 0.06               # 追っている位置からこれより大きく離れた検知は「外れ値」として扱う（normalized_y）
max_miss: 2                  # 確定後、何フレームまでの途切れ・外れ値を許すか（その間は直前の位置を保つ）
track_gate: 0.03             # （v0.2）確定後、予測位置からこの範囲（normalized_y）の線を同じ道路端とみなす
support_step: 1.0            # （v0.2）確定後、予測位置の近くの線をこの段差の強さ以上なら「支え」として追跡を続ける
far_switch: 0.03             # （v0.2）確定した道路端よりこれ以上向こう（画像の上）の線には乗り換えない
                             #        （白線の手前の線として選ばれたときは例外）
exit_y: 0.93                 # （v0.2.1）追っている線がこれより下まで来たら、帯の向こう側の線への引き継ぎを許す
exit_band: 0.12              # （v0.2.1）引き継ぐ線は追っている線からこの範囲（normalized_y）の向こうまで
pending_gate: 0.02           # （v0.2.1）確定前、追っている位置からこの範囲の弱い線で追跡を保つ（0 で無効）
pending_step: 2.0            # （v0.2.1）その弱い線に求める段差の強さ
pending_max: 5               # （v0.2.1）その弱い線だけで続けて追跡を保つのは何フレームまでか
last_gate: 0.02              # （v0.2.2）予測位置から外れても、直前の位置からこの範囲の検知は同じ道路端とみなす
support_up: 0.012            # （v0.3.1）弱い線で追跡を続けるとき、今の位置よりこれ以上向こう（画像の上）へは動かさない
                             #          （地面の線は前に進むロボットから遠ざからないため。横断歩道の白線の縁に乗り移るのを防ぐ）
start_enabled: true          # （v0.2）起動直後から検知するか。false なら ~enable に true が来るまで止めておく

# ---- 判定したい道路端だけを出す（v0.3。ナビの現在のノード番号で選ぶ。時間やフレーム番号は使わない） ----
use_target_gate: true        # false にすると、ノード番号で絞らずにすべての検知を配信する（v0.2 と同じ）
node_topic: /toponav/localization_diagnostics   # ナビの現在のノード番号（LocalizationDiagnostics.current_node_idx）
node_timeout: 3.0            # ノード番号がこの秒数届かなければ、検知結果を配信しない
target_before: 3             # 判定区間: 現在のノードが [node - target_before, node + target_after] の間だけ配信する
target_after: 4
pass_y: 0.90                 # 確定していた道路端がこれより下（手前）まで来た後に見えなくなったら「通過」→ その判定区間では以後配信しない
pass_jump: 0.15              # 確定位置がこれ以上向こうへ跳んだら、別の線（渡った先の道路端など）に移ったとみなして「通過」にする
pass_from: 0.80              # 通過にするのは、これより向こう（小さい値）から手前まで追ってきた線だけ
pass_arm_before: 1           # 通過にするのは、現在のノードが node - pass_arm_before 以降のときだけ（v0.3.1 で 2 → 1。ナビのノードが 1 つ先に進んでいても、
                             #   歩道の中の線が画像の下に出ていったのを「通過」にしないため。本物の道路端の通過はどれも node 以降）
acq_y: 1.00                  # 新規検知を画像下端まで許可
reacq_back: 0.03             # （v0.3.1）ただし、判定区間の中で最後に配信した位置の -reacq_back〜+reacq_fwd で見つけ直した線は配信する
reacq_fwd: 0.08              #          （人に隠れて一度見失った道路端を、手前で見つけ直したとき）
pub_min_y: 0.655             # （v0.3.1）これより向こう（ROI の上の縁にかかる位置）は、まだ配信しない
targets:                     # 判定したい道路端（メモのノード番号）。before / after を書くと、その道路端だけ判定区間を変える
                             # （v0.3.2）detector: / tracker: / gate: を書くと、その道路端の判定区間の中だけ、
                             #   検知・連続検出・絞り込みのパラメータを変えられる（名前はこのファイルと同じ。E06 が例）
  - {name: E01, node: 159}
  - {name: E02, node: 173}
  - {name: E03, node: 209}
  - {name: E04, node: 218}
  - {name: E05, node: 279}
  - name: E06                # 角で旋回してから見える。旋回前は渡らない道路の道路端が正面にある
    node: 315
    before: 1
    # （v0.3.2）交差点の角で、道路端が右下がりに大きく斜めに見え、見えるのは約 1.7 秒だけ。
    # 道路端の向こう側に車線の白線と横断歩道の白線があり、ふつうの設定ではそちらを選んでしまうので、この判定区間の中だけ設定を変える
    detector:
      max_angle: 65            # 射影後の画像で 35° より急な線分も使う（斜めの道路端）
      min_coverage: 0.2        # 斜めの線は横方向の長さが短いので緩める（既定 0.35）
      step_th: 1.2             # 歩道とアスファルトの明るさの差が小さい（日陰）ので緩める（既定 2.0）
      pass_ratio: 0.5          # （既定 0.6）
      cw_enable: false         # 「横断歩道の白線のすぐ手前の線を選ぶ」処理を使わない（白線との間の車線の白線を選んでしまうため）
      paint_exclude: true      # 白い塗装（横断歩道・車線の白線）の縁は道路端にしない
      edge_angle_min: 5        # 元画像で右下がり 5〜40° の線だけを道路端にする（道路端は +11〜+16°、車線の白線は右上がり）
      edge_angle_max: 40
    tracker:
      detection_count_th: 2    # 見える時間が短いので 2 フレームで確定（既定 3）
    gate:
      pass_y: 0.80             # 斜めの道路端は画像の左下へ出ていくので、0.80 より下まで来て見えなくなったら通過（既定 0.90）
      pub_min_y: 0.64          # 見え始めは ROI の上の縁にかかるので、そこから配信する（既定 0.655）
  - {name: E07, node: 427}
  - {name: E08, node: 640}
  - {name: E09, node: 746, before: 0}   # 角を曲がり終えてから見える。曲がる前は渡らない道路の横断歩道と人ごみ
  - {name: E10, node: 791}
  - {name: E11, node: 854}
  - {name: E12, node: 863, before: 1}   # メモのノードが道路端に近い。860〜861 では道路端はまだ見えず、歩道の中の線だけが見える
  - {name: E13, node: 903}
  - {name: E14, node: 917}

# ---- 入出力 -----------------------------------------------------------------
visualize: true              # デバッグ画像 ~debug_image/compressed を配信するか
debug_jpeg_quality: 80       # デバッグ画像の JPEG 品質
debug_width: 720             # デバッグ画像の左側（入力画像）の幅 [px]
decode_reduction: 1          # JPEG のデコード倍率。1 = 元の解像度でデコードしてから縮小（v0.2 の既定。OpenCV の版によらず同じ結果）
                             # 2 / 4 / 8 / auto = 縮小しながらデコード（速いが OpenCV 4.2 では効かず、版で結果が少し変わる）

# ---- 処理解像度 -------------------------------------------------------------
process_width: 720           # この幅に縮小して処理する [px]（2880 の 1/4。約 30ms/フレーム）

# ---- ROI（台形 → 長方形に射影変換する範囲） --------------------------------
roi_units: normalized        # normalized: 0〜1 の正規化座標 / pixel: 入力画像のピクセル座標
roi_upper_left: [0.00, 0.85]
roi_upper_right: [1.00, 0.85]
roi_lower_left: [0.00, 1.00]
roi_lower_right: [1.00, 1.00]

# ---- 線分抽出（LSD） --------------------------------------------------------
clahe_clip: 2.0              # CLAHE（局所的なコントラスト強調）の強さ
clahe_grid: 4                # CLAHE のタイル数
blur_ksize: 5                # ぼかしのカーネルサイズ（奇数）
lsd_scale: 0.6               # LSD 内部での縮小率（既存ノードと同じ）
seg_min_len: 0.03            # 残す線分の最小長（射影後の画像の幅に対する割合）
max_angle: 35.0              # 横向きとみなす傾きの上限 [deg]

# ---- 線分の連結 -------------------------------------------------------------
link_angle: 12.0             # つなぐ線分同士の角度差の上限 [deg]
link_dist: 0.012             # つなぐときの縦ずれの上限（射影後の高さに対する割合）
link_gap: 0.20               # つなぐときの横の隙間の上限（射影後の幅に対する割合）
min_coverage: 0.35           # 境界の候補に必要な横方向の長さ（射影後の幅に対する割合）
max_rms: 0.015               # 曲線への当てはまり誤差の上限（射影後の高さに対する割合）

# ---- 境界の上下の見た目の差 -------------------------------------------------
band_gap: 0.012              # 境界から比較する帯までの隙間（射影後の高さに対する割合）
band_gap2: 0.035             # 細い帯（白線など）を除外するための、離れた位置の隙間
band_width: 0.040            # 比較する帯の厚さ
n_bins: 8                    # 線を何区間に分けて比べるか
sigma_L: 18.0                # 明るさの差の目安（Lab の L, 0〜255）
sigma_ab: 8.0                # 色の差の目安（Lab の a, b）
sigma_T: 0.45                # 模様の差の目安（勾配の強さの比の対数）
ref_height: 0.12             # 「今いる路面」とみなす ROI 下端の帯の高さ

# ---- 道路端の選び方 ---------------------------------------------------------
step_th: 2.0                 # 区間ごとの「段差の強さ」の閾値
own_th: 0.0                  # 区間ごとの「今いる路面との差（向こう側 - 手前側）」の閾値
pass_ratio: 0.6              # 両方の条件を満たす区間の割合の下限
rel_th: 0.3                  # 画像内で一番強い境界に対する、相対的な強さの下限
band_ext: 0.035              # 選んだ線の手前この範囲（正規化 y）に有効な線があれば、そちらを道路端とする

# ---- 横断歩道の白線（v0.2） -------------------------------------------------
# 明るい帯（上の縁と下の縁の組）が同じ明るさで並んでいれば横断歩道とみなし、
# いちばん手前の白線より手前で、白線にいちばん近い境界を道路端とする（白線・向こう側の道路端と間違えないため）
cw_enable: true              # 白線を手がかりに道路端を選ぶか
cw_dL: 30.0                  # 白線の縁とみなす、線の両側の明るさの差（Lab の L, 0〜255）
cw_Lmin: 120.0               # 白線の明るさの下限
cw_dLsame: 20.0              # 同じ横断歩道の白線どうしの明るさの差の上限（道路端の明るい帯を白線と間違えないため）
cw_hmax: 0.12                # 白線 1 本の高さの上限（normalized_y）
cw_gap_ratio: 2.5            # 白線どうしの隙間の上限（白線の高さに対する倍率）
cw_min_stripes: 2            # 横断歩道とみなす白線の本数
cw_single: true              # 白線が 1 本しか見えていなくても、次の 3 つを満たせば横断歩道とみなす
cw_single_L: 145.0           #   白線の明るさの下限
cw_single_dL: 50.0           #   白線と周りの路面の明るさの差の下限
cw_single_same: 12.0         #   白線の向こう側と手前側の路面の明るさの差の上限（同じアスファルト）
cw_margin: 0.003             # 白線の手前の縁からこれ以上手前の線だけを道路端の候補にする（normalized_y）
cw_search: 0.2               # 白線の手前の縁から道路端を探す範囲（normalized_y）
cw_step_th: 1.0              # 白線の手前で道路端に求める段差の強さの下限（通常の step_th 2.0 より緩い）

# ---- 点字ブロック（v0.3.1） --------------------------------------------------
# 線のすぐ向こう側か手前側が黄色の線は、点字ブロックの列の縁なので道路端にしない（道路端は舗装の変わり目）
tactile_enable: true
tactile_db: 15.0             # 黄色とみなす色の下限（Lab の b。128 を 0 とした値。点字ブロックは日なたで約 +23、日陰で +15 前後、路面は -5〜+7）
tactile_amin: -8.0           # 黄色とみなす色の a の下限（128 を 0 とした値。緑のフェンスや草は約 -30）
tactile_frac: 0.5            # 線の片側の帯のうち、黄色の画素がこの割合以上なら点字ブロックの縁
